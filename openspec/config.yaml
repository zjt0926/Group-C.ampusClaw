schema: spec-driven

context: |
  本仓库是 CampusClaw 小组学期项目，面向高中班级的 AI 学科助手系统。
  技术栈：Flask 3 + Jinja2 服务端渲染、JWT 认证、SQLAlchemy + Alembic、Docker Compose。
  AI 能力统一走课程网关，密钥只从服务端环境变量读取。
  分层约定：app/api | services | repositories | adapters。
  已有能力：A—E 五组（认证与班级学科底座、讲义入库与检索、助手 SSE 对话、技能与智能体配置、MCP 接入）。
  本次变更补齐作业闭环 F—I 四组，新增 6 个页面与 4 张表。
  中文叙述，保留 OpenSpec 所需的 Requirement、Scenario、WHEN、THEN 格式。
  规约只写可判定的条件；未实现的能力不得写成已完成，未执行的测试不得写成通过。

rules:
  proposal:
    - 写明本次功能、已有依赖、显式不做的功能。
    - 必须说明当前仓库是否已有实现，避免把计划当成现状。
  specs:
    - 每条要求必须有可判定的场景，至少覆盖正常路径与一条失败路径。
    - 涉及数据的场景必须写明班级隔离与个人数据可见范围。
    - 引用来源必须来自真实命中，检索为空时要求明说未命中。
  design:
    - 记录关键取舍与被放弃的备选方案及原因。
    - 区分课程默认值、本组选定值与实施前待确定项。
  tasks:
    - 每项任务附检查方法；未实现的任务保持未勾选。
    - 任务编号与需求编号对应，便于验收时双向追溯。
